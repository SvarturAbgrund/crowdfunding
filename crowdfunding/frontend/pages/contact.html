<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulario de Contacto</title>
  <link rel="stylesheet" href="/crowdfunding/frontend/assets/css/style-contact.css">
</head>
<body>
  <header>
    <h1>Contacto</h1>
    <nav>
      <ul>
        <li><a href="/crowdfunding/frontend/index.html">Inicio</a></li>
        <li><a href="#" class="active">Contacto</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="form-section">
      <h2>Envíanos un mensaje</h2>

      <form id="contactForm" class="contact-form">
        <label for="name">Nombre</label>
        <input type="text" id="name" placeholder="Tu nombre" required>

        <label for="email">Correo electrónico</label>
        <input type="email" id="email" placeholder="tu@correo.com" required>

        <label for="subject">Asunto</label>
        <input type="text" id="subject" placeholder="Asunto del mensaje" required>

        <label for="message">Mensaje</label>
        <textarea id="message" placeholder="Escribe tu mensaje..." required></textarea>

        <button type="submit">Enviar</button>
      </form>

      <p id="statusMessage" class="status"></p>
    </section>
  </main>

  <footer>
    <div class="socials">
    <a href="#" class="facebook">Facebook</a>
    <a href="#" class="twitter">Twitter</a>
    <a href="#" class="instagram">Instagram</a>

    <p>© 2025 Crowdfunding Platform</p>
      
  </div>
  </footer>

  <script src="/crowdfunding/frontend/js/contact.js"></script>
</body>
</html>
